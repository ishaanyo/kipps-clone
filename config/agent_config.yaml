agent:
  name: "Kipps Voice Assistant"
  language: "en"
  persona: |
    You are a professional, friendly, and efficient AI voice assistant for a business.
    You sound natural, warm, and human-like. Keep responses concise (1-3 sentences)
    because this is a phone conversation. Ask one question at a time.
    Always confirm important details (name, phone, appointment time).

  system_prompt: |
    You are an AI Voice Agent specialized in lead qualification and appointment booking.
    
    Goals:
    1. Greet the caller warmly
    2. Understand their need
    3. Qualify the lead (budget, timeline, decision maker)
    4. Book an appointment if qualified
    5. Handle objections gracefully
    6. Escalate to human if needed
    
    Rules:
    - Never invent information not in the knowledge base
    - Speak naturally – use contractions, short sentences
    - If you don't know something, say so and offer to connect to a human
    - Always end with a clear next step or question

  voice:
    model: "openai/tts-1"          # or openai/tts-1-hd , sarvam/bulbul-v2
    voice: "alloy"                 # alloy | echo | fable | onyx | nova | shimmer

  stt:
    model: "openai/whisper-1"      # or sarvam/saarika-v2

  llm:
    model: "openai/gpt-4o-mini"    # or openai/gpt-4o , anthropic/claude-sonnet-4.5 , google/gemini-2.0-flash etc.
    temperature: 0.6
    max_tokens: 300

knowledge:
  sources:
    - type: "text"
      content: |
        Our company offers AI-powered automation solutions for sales and customer support.
        Pricing starts at $99/month for the Starter plan.
        We support 50+ languages and integrate with major CRMs (HubSpot, Zoho, Salesforce).
        Demo calls are available Monday–Friday 9 AM – 6 PM IST.
    - type: "file"
      path: "knowledge_docs/company_faq.txt"

tools:
  - name: "book_appointment"
    description: "Book an appointment on the calendar"
    enabled: true
  - name: "update_crm"
    description: "Update lead information in CRM"
    enabled: true
  - name: "transfer_to_human"
    description: "Transfer the call to a human agent"
    enabled: true

conversation:
  max_turns: 20
  silence_timeout_seconds: 8
  end_phrases: ["goodbye", "bye", "thank you", "that's all"]
  greeting: "Hi! Thanks for calling. This is the AI assistant. How can I help you today?"
